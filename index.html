const ORD = {
  tea:{em:'🍵',lk:'tea',bg:'rgba(16,185,129,0.12)',acc:'#10b981',brd:'rgba(16,185,129,0.35)'},

// ===== SOUND =====
function playSound(type){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const freqs={tea:[523,659,784],coffee:[330,392,523],water:[880,1047,1319],special:[440,554,659,880]};
    const types={tea:'sine',coffee:'triangle',water:'sine',special:'square'};
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.type=types[type]||'sine';
    const fr=freqs[type]||freqs.tea;
    fr.forEach((f,i)=>{
      osc.frequency.setValueAtTime(f,ctx.currentTime+i*0.15);
      gain.gain.setValueAtTime(0.25,ctx.currentTime+i*0.15);
      gain.gain.setValueAtTime(0,ctx.currentTime+i*0.15+0.13);
    });
    osc.start(ctx.currentTime);osc.stop(ctx.currentTime+fr.length*0.15+0.2);
  }catch(e){}
}

function timeSince(ts){
  const d=Math.floor((Date.now()-ts)/1000);
  if(d<60)return d+'s';return Math.floor(d/60)+'m';
}

function todayStr(){
  return new Date().toLocaleDateString('en-CA');
}

// ============================================================
//  GAS COMMUNICATION — كل شيء عبر GET لتجنب مشكلة no-cors
// ============================================================
async function gasGet(action, params={}) {
  const url = new URL(GAS_URL);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, String(v)));
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (json && json.error) throw new Error(json.error);
  return json;
}

// ✅ الإصلاح الأساسي: استخدام GET بدلاً من POST لتجنب مشكلة no-cors مع GAS
async function gasAction(action, params={}) {
  const url = new URL(GAS_URL);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k,v]) => {
    if (v !== undefined && v !== null) url.searchParams.set(k, String(v));
  });
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (json && json.error) throw new Error(json.error);
  return json;
}

// ============================================================
//  SESSION
// ============================================================
function saveSession() {
  try {
    localStorage.setItem('orderSys_session', JSON.stringify({
      view: state.view,
      user: state.user,
      loginEmpId: state.loginEmpId
    }));
  } catch(e) {}
}

function clearSession() {
  try { localStorage.removeItem('orderSys_session'); } catch(e) {}
}

function restoreSession() {
  try {
    const raw = localStorage.getItem('orderSys_session');
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.view === 'employee') {
      const emp = state.employees.find(x => String(x.id) === String(s.loginEmpId));
      if (!emp) return;
      state.view       = 'employee';
      state.user       = { ...emp, role: 'employee' };
      state.loginEmpId = s.loginEmpId;
    } else if (s.view === 'staff') {
      state.view = 'staff';
      state.user = s.user || { name: 'موظف الخدمة', role: 'staff' };
    } else if (s.view === 'admin') {
      state.view = 'admin';
      state.user = s.user || { name: 'المدير', role: 'admin' };
    }
  } catch(e) {}
}

async function loadInitialData() {
  state.loading = true;
  state.gasError = null;
  render();
  try {
    const [emps, depts] = await Promise.all([
      gasGet('getEmployees'),
      gasGet('getDepts')
    ]);
    if (Array.isArray(emps)) state.employees = emps;
    if (Array.isArray(depts)) state.depts = depts;
    restoreSession();
    state.loading = false;
    render();
    if (state.view !== 'login') {
      await loadOrders();
      if (state.view === 'staff') startAutoRefresh();
    }
  } catch(e) {
    console.error('loadInitialData:', e);
    state.gasError = e.message;
    state.loading = false;
    render();
  }
}

async function loadOrders() {
  state.loadingOrders = true;
  render();
  try {
    const orders = await gasGet('getOrders', {date: todayStr()});
    if (Array.isArray(orders)) {
      if (state.view === 'staff') {
        const prevPendingIds = new Set(state.orders.filter(o=>o.status==='pending').map(o=>String(o.id)));
        state.orders = orders;
        const newPending = orders.filter(o=>o.status==='pending'&&!prevPendingIds.has(String(o.id)));
        if (newPending.length > 0) {
          state.newOrderCount += newPending.length;
          // إشعار صوتي للـ staff عند وصول طلب جديد
          playSound(newPending[0].type || 'tea');
        }
      } else {
        state.orders = orders;
      }
      state.lastRefresh = Date.now();
      state.gasError = null;
    }
  } catch(e) {
    console.error('loadOrders:', e);
    state.gasError = e.message;
  }
  state.loadingOrders = false;
  render();
}

// تحديث تلقائي كل 15 ثانية (للـ staff) — قلّلنا الوقت لاستجابة أسرع
function startAutoRefresh() {
  stopAutoRefresh();
  state.refreshTimer = setInterval(() => {
    if (state.view === 'staff') loadOrders();
    else stopAutoRefresh();
  }, 15000);
}

function stopAutoRefresh() {
  if (state.refreshTimer) {
    clearInterval(state.refreshTimer);
    state.refreshTimer = null;
  }
}

// ===== RENDER =====
function render(){
  const s=state, t=T[s.lang], rtl=s.lang!=='en';
  document.body.className=s.dark?'':'light';
  document.body.style.direction=rtl?'rtl':'ltr';

  if (s.loading) {
    document.getElementById('app').innerHTML = `
      <div class="loading-screen">
        <div style="font-size:64px;animation:spin 1.5s linear infinite">☕</div>
        <div style="font-size:16px;font-weight:700;color:var(--acc)">${t.loading}</div>
        <div style="font-size:13px;color:var(--mut)">Internal Order System</div>
        ${s.gasError ? `
          <div style="margin-top:20px;padding:16px 20px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:14px;color:#f87171;font-size:13px;text-align:center;max-width:300px">
            ⚠️ ${t.gasErr}<br><span style="opacity:0.7;font-size:11px">${s.gasError}</span>
          </div>
          <button onclick="loadInitialData()" class="btn-primary" style="margin-top:10px;max-width:200px">${t.retry}</button>
        ` : ''}
      </div>
    `;
    return;
  }

  let html='';
  if(s.view==='login')         html=renderLogin(t,rtl);
  else if(s.view==='employee') html=renderEmployee(t,rtl);
  else if(s.view==='staff')    html=renderStaff(t,rtl);
  else                          html=renderAdmin(t,rtl);

  document.getElementById('app').innerHTML=html;
}

}

// ===== STAFF VIEW =====
function renderStaff(t,rtl){
  const pend=state.orders.filter(o=>o.status==='pending');
  const prep=state.orders.filter(o=>o.status==='preparing');
  const delv=state.orders.filter(o=>o.status==='delivered');
  const lastR = state.lastRefresh ? timeSince(state.lastRefresh)+' ago' : '--';

  return `<div style="min-height:100vh">
    <div class="navbar">
      <div class="nav-title">🛎️ ${t.queue}</div>
      <div class="nav-actions">
        ${state.newOrderCount>0?`<div style="position:relative"><span style="font-size:22px">🔔</span><span class="badge new-badge">${state.newOrderCount}</span></div>`:'<span style="font-size:22px;opacity:0.4">🔔</span>'}
        <button class="icon-btn" onclick="state.newOrderCount=0;loadOrders()" title="Refresh">🔄</button>
        <button class="icon-btn" onclick="toggleDark()">${state.dark?'☀️':'🌙'}</button>
        <button class="icon-btn" onclick="logout()">🚪</button>
      </div>
    </div>
    <div class="refresh-bar">
      ${state.loadingOrders
        ? `<div class="spinner" style="width:14px;height:14px;border-width:2px"></div> ${t.loadingOrders}`
        : `🔄 ${t.refreshIn} (15s) • آخر تحديث: ${lastR}`}
    </div>
    <div style="padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
      ${[{lb:t.pending,count:pend.length,c:'#f59e0b'},{lb:t.preparing,count:prep.length,c:'#3b82f6'},{lb:t.delivered,count:delv.length,c:'#10b981'}].map(x=>`
        <div class="stat-card">
          <div class="stat-num" style="color:${x.c}">${x.count}</div>
          <div class="stat-lbl">${x.lb}</div>
        </div>
      `).join('')}
    </div>
    <div style="padding:0 16px 80px">
      ${state.orders.length===0?`<div style="text-align:center;padding:60px 0;color:var(--mut)">
        <div style="font-size:56px">📭</div><div style="margin-top:14px;font-size:16px">${t.noOrders}</div>
      </div>`:`
        <div style="display:flex;flex-direction:column;gap:12px">
          ${[...state.orders].sort((a,b)=>{
            const pr={pending:0,preparing:1,delivered:2};
            if(a.priority&&!b.priority)return -1;if(b.priority&&!a.priority)return 1;
            if(pr[a.status]!==pr[b.status])return pr[a.status]-pr[b.status];
            return b.ts-a.ts;
          }).map(o=>{
            const cfg=ORD[o.type]||ORD.special;
            const isNew=o.status==='pending';
            return `<div class="order-card" style="border-color:${isNew?cfg.brd:'var(--brd)'};border-${rtl?'right':'left'}:4px solid ${cfg.acc}">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
                <div style="display:flex;align-items:center;gap:12px">
                  <span style="font-size:36px">${cfg.em}</span>
                  <div>
                    <div style="font-weight:800;font-size:17px;color:${cfg.acc}">${t[cfg.lk]||o.type}</div>
                    <div style="color:var(--mut);font-size:13px;margin-top:2px">👤 ${o.empName} &nbsp;•&nbsp; 🏢 ${o.dept}</div>
                    ${o.note?`<div style="color:var(--acc2);font-size:12px;margin-top:4px">📝 ${o.note}</div>`:''}
                  </div>
                </div>
                <div style="text-align:${rtl?'left':'right'}">
                  <div style="color:var(--mut);font-size:12px">⏱ ${timeSince(o.ts)}</div>
                  ${o.priority?`<div style="color:#ef4444;font-size:11px;font-weight:700;margin-top:4px">🔴 ${t.priority}</div>`:''}
                </div>
              </div>
              <div style="display:flex;gap:8px">
                ${o.status==='pending'?`<button class="action-btn" style="color:#60a5fa;border-color:rgba(59,130,246,0.4);background:rgba(59,130,246,0.08)" onclick="setStatus('${o.id}','preparing')">${t.doPrepare}</button>`:''}
                ${o.status==='preparing'?`<button class="action-btn" style="color:#34d399;border-color:rgba(16,185,129,0.4);background:rgba(16,185,129,0.08)" onclick="setStatus('${o.id}','delivered')">${t.doDeliver}</button>`:''}
                ${o.status==='delivered'?`<div style="flex:1;text-align:center;color:#10b981;font-weight:700;font-size:14px;padding:10px">✅ ${t.delivered}</div>`:''}
                <button onclick="togglePriority('${o.id}')" style="padding:10px 14px;border-radius:10px;border:1px solid ${o.priority?'rgba(239,68,68,0.4)':'var(--brd)'};background:${o.priority?'rgba(239,68,68,0.1)':'transparent'};color:${o.priority?'#ef4444':'var(--mut)'}">🚨</button>
              </div>
            </div>`;
          }).join('')}
        </div>
      `}
    </div>
  </div>`;
}

// ===== ADMIN VIEW =====
function renderAdmin(t,rtl){
  const TABS=[{k:'overview',em:'📊'},{k:'employees',em:'👥'},{k:'departments',em:'🏢'},{k:'reports',em:'📈'}];
  const pieColors={tea:'#10b981',coffee:'#f59e0b',water:'#60a5fa',special:'#a855f7'};
  const maxBar=Math.max(...CHART_VALS);

  const realTotals={tea:0,coffee:0,water:0,special:0};
  state.orders.forEach(o=>{ if(realTotals[o.type]!==undefined) realTotals[o.type]++; });
  const totalReal=Object.values(realTotals).reduce((a,b)=>a+b,0)||1;
  const pieData=Object.entries(realTotals).map(([k,v])=>({k,v:Math.round(v/totalReal*100)||0}));

  let content='';

  if(state.adminTab==='overview'){
    const totalToday=state.orders.length;
    content=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
        ${[
          {lb:t.today,v:totalToday,em:'📅',c:'#10b981'},
          {lb:t.active,v:state.employees.length,em:'👥',c:'#60a5fa'},
          {lb:t.pending,v:state.orders.filter(o=>o.status==='pending').length,em:'⏳',c:'#a855f7'},
          {lb:t.preparing,v:state.orders.filter(o=>o.status==='preparing').length,em:'🔄',c:'#f59e0b'},
        ].map(x=>`<div class="stat-card"><div style="font-size:26px;margin-bottom:6px">${x.em}</div>
          <div class="stat-num" style="color:${x.c};font-size:30px">${x.v}</div>
          <div class="stat-lbl">${x.lb}</div></div>`).join('')}
      </div>
      <div class="card" style="margin-bottom:16px">
        <h3 style="font-weight:700;font-size:14px;margin-bottom:16px">📊 ${t.dailyStats}</h3>
        <div style="display:flex;align-items:flex-end;gap:6px;height:120px">
          ${CHART_VALS.map((v,i)=>`
            <div class="chart-bar-wrap">
              <div class="chart-bar-inner" style="height:100%">
                <div class="chart-bar-fill" style="height:${Math.round(v/maxBar*100)}%;background:var(--acc);opacity:${0.5+v/maxBar*0.5}"></div>
              </div>
              <div class="chart-lbl">${t.days[i]}</div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <h3 style="font-weight:700;font-size:14px;margin-bottom:16px">🥧 ${t.orderTypes}</h3>
        <div style="display:flex;gap:12px;align-items:center">
          <svg width="120" height="120" viewBox="0 0 120 120">
            ${(()=>{let a=0,segs='';pieData.forEach(({k,v})=>{const r=52,cx=60,cy=60,sa=a*Math.PI/180,ea=(a+v*3.6)*Math.PI/180;const x1=cx+r*Math.cos(sa),y1=cy+r*Math.sin(sa),x2=cx+r*Math.cos(ea),y2=cy+r*Math.sin(ea);segs+=`<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${v*3.6>180?1:0},1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${pieColors[k]}" opacity="0.9"/>`;a+=v*3.6;});return segs;})()}

            <text x="60" y="65" text-anchor="middle" fill="var(--txt)" font-size="14" font-weight="700" font-family="Cairo">${totalReal}</text>
          </svg>
          <div style="flex:1;display:flex;flex-direction:column;gap:10px">
            ${pieData.map(({k,v})=>`
              <div style="display:flex;justify-content:space-between;align-items:center">
                <div style="display:flex;align-items:center;gap:8px">
                  <div style="width:10px;height:10px;border-radius:50%;background:${pieColors[k]}"></div>
                  <span style="font-size:13px">${t[k]} ${ORD[k].em}</span>
                </div>
                <div>
                  <div class="progress-bar" style="width:60px;display:inline-block;vertical-align:middle;margin-${rtl?'left':'right'}:8px">
                    <div class="progress-fill" style="width:${v}%;background:${pieColors[k]}"></div>
                  </div>
                  <span style="font-weight:700;color:${pieColors[k]};font-size:13px">${v}%</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
      <div class="card">
        <h3 style="font-weight:700;font-size:14px;margin-bottom:16px">🏆 ${t.topEmps}</h3>
        ${[...state.employees].sort((a,b)=>b.req-a.req).slice(0,4).map((e,i)=>`
          <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:${i<3?'1px solid var(--brd)':'none'}">
            <div style="color:var(--mut);font-weight:700;font-size:14px;min-width:20px">${i+1}</div>

            </div>
            <span style="font-weight:800;color:var(--acc)">${e.req} ${t.reqs}</span>
          </div>
        `).join('')}
      </div>
    `;

          <select id="newEmpD" onchange="state.newEmpDept=this.value" style="flex:1;min-width:100px">
            <option value="">${t.selectDept}</option>

          </select>

        `).join('')}
      </div>

                <div style="text-align:${rtl?'left':'right'}">
                  <span style="font-size:11px;padding:3px 8px;border-radius:8px;background:${o.status==='delivered'?'rgba(16,185,129,0.15)':o.status==='preparing'?'rgba(59,130,246,0.15)':'rgba(245,158,11,0.15)'};color:${o.status==='delivered'?'#10b981':o.status==='preparing'?'#60a5fa':'#f59e0b'}">${t[o.status]}</span>
                  <div style="color:var(--mut);font-size:11px;margin-top:3px">${timeSince(o.ts)}</div>
                </div>
              </div>
            `).join('')}
          </div>
        `}
      </div>
    `;
  }

  return `<div style="min-height:100vh">
    <div class="navbar">
      <div style="font-weight:800;font-size:17px">⚙️ ${t.admin}</div>
      <div class="nav-actions">
        ${langBtns(t,rtl)}
        ${state.saving?`<div class="spinner"></div>`:''}
        <button class="icon-btn" onclick="toggleDark()">${state.dark?'☀️':'🌙'}</button>
        <button class="icon-btn" onclick="logout()">🚪</button>
      </div>
    </div>
    <div class="tab-bar">
      ${TABS.map(({k,em})=>`<button class="tab-btn ${state.adminTab===k?'active':''}" onclick="setAdminTab('${k}')">${em} ${T[state.lang][k]||k}</button>`).join('')}
    </div>
    <div style="padding:18px 16px 80px;max-width:600px;margin:0 auto">${content}</div>
  </div>`;
}

// ============================================================
//  EVENT HANDLERS
// ============================================================
function setLang(l){state.lang=l;render();}
function toggleDark(){state.dark=!state.dark;render();}
function setAdminTab(tab){
  state.adminTab=tab;
  if(tab==='reports') loadOrders();
  else render();
}
function selectEmp(id){state.loginEmpId=id;render();}

function logout(){
  stopAutoRefresh();
  clearSession();
  state.view='login';state.user=null;state.loginRole=null;
  state.loginEmpId=null;state.newOrderCount=0;state.orders=[];
  state.lastRefresh=null;state.gasError=null;
  render();
}

async function selectRole(r){
  if(r==='staff'){
    state.user={name:'موظف الخدمة',role:'staff'};
    state.view='staff';
    saveSession();
    render();
    await loadOrders();
    startAutoRefresh();
  } else if(r==='admin'){
    state.user={name:'المدير',role:'admin'};
    state.view='admin';
    saveSession();
    render();
    await loadOrders();
  } else {
    state.loginRole='employee';
    render();
  }
}

async function doLogin(){
  if(!state.loginEmpId) return;
  const e=state.employees.find(x=>String(x.id)===String(state.loginEmpId));
  if(!e) return;
  state.user={...e,role:'employee'};
  state.view='employee';
  saveSession();
  render();
  await loadOrders();
}

async function placeOrder(type){
  const e=state.employees.find(x=>String(x.id)===String(state.loginEmpId))||state.user;
  const orderId = Date.now();
  const order={
    id:orderId, type,
    empName:e?.name||'',
    dept:e?.dept||'',
    note:state.note,
    status:'pending',
    ts:orderId,
    priority:false,
    date:todayStr()
  };
  // Optimistic update
  state.orders.unshift(order);
  state.note='';
  state.showSuccess=true;
  state.successType=type;
  playSound(type);
  render();
  setTimeout(()=>{state.showSuccess=false;render();},3000);

  // ✅ إرسال عبر GET بدلاً من POST no-cors
  try {
    state.saving=true;
    await gasAction('addOrder', {
      id:     orderId,
      type:   type,
      empName: e?.name||'',
      dept:   e?.dept||'',
      note:   state.note||'',
      ts:     orderId,
      date:   todayStr()
    });
    // بعد الحفظ، أعد تحميل الطلبات للتأكد
    await loadOrders();
  } catch(err){
    console.error('placeOrder:', err);
  } finally {
    state.saving=false;
    render();
  }
}

async function setStatus(id, status){
  const o=state.orders.find(x=>String(x.id)===String(id));
  if(o){
    o.status=status;
    if(status==='preparing') state.newOrderCount=Math.max(0,state.newOrderCount-1);
  }
  render();
  try {
    // ✅ إرسال عبر GET
    await gasAction('updateOrder', {id: String(id), status});
  } catch(err){ console.error('setStatus:', err); }
}

async function togglePriority(id){
  const o=state.orders.find(x=>String(x.id)===String(id));
  if(o) o.priority=!o.priority;
  render();
  try {
    await gasAction('updateOrder', {id: String(id), priority: String(o?.priority||false)});
  } catch(err){ console.error('togglePriority:', err); }
}

async function addEmployee(){
  const n=state.newEmpName.trim(), d=state.newEmpDept;
  if(!n||!d) return;
  const av=n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const empId=Date.now();
  const emp={id:empId, name:n, nameEn:n, dept:d, av, req:0};
  state.employees.push(emp);
  state.newEmpName='';state.newEmpDept='';
  render();
  try {
    state.saving=true;
    await gasAction('addEmployee', {id:empId, name:n, nameEn:n, dept:d, av});
  } catch(err){ console.error('addEmployee:', err); }
  finally { state.saving=false; render(); }
}

async function delEmployee(id){
  state.employees=state.employees.filter(e=>String(e.id)!==String(id));
  render();
  try {
    await gasAction('deleteEmployee', {id: String(id)});
  } catch(err){ console.error('delEmployee:', err); }
}

async function addDept(){
  const n=state.newDeptName.trim();
  if(!n) return;
  state.depts.push(n);
  state.newDeptName='';
  render();
  try {
    state.saving=true;
    await gasAction('addDept', {name:n});
  } catch(err){ console.error('addDept:', err); }
  finally { state.saving=false; render(); }
}

async function delDept(name){
  state.depts=state.depts.filter(d=>d!==name);
  state.employees=state.employees.map(e=>e.dept===name?{...e,dept:''}:e);
  render();
  try {
    await gasAction('deleteDept', {name});
  } catch(err){ console.error('delDept:', err); }
}

function exportCSV(){
  const rows=[['الاسم','القسم','النوع','الملاحظة','الحالة','الوقت']];
  state.orders.forEach(o=>{
    rows.push([o.empName,o.dept,o.type,o.note||'',o.status,new Date(o.ts).toLocaleTimeString('ar')]);
  });
  const csv=rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='orders-'+todayStr()+'.csv'; a.click();
  URL.revokeObjectURL(url);
}
  if ('serviceWorker' in navigator) {

  navigator.serviceWorker.register('/sw.js');

}

// ===== BOOT =====
loadInitialData();
</script>
</body>
</html>
